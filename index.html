<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Neon Space Shooter</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #0f1524;
      --text: #e6f0ff;
      --muted: #9fb0d1;
      --accent: #6cf0ff;
      --accent-2: #a86cff;
      --danger: #ff6c9b;
      --success: #61ffa5;
      --shadow: 0 10px 30px rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(80% 80% at 50% 0%, #10182a 0%, var(--bg) 55%) fixed;
      display: grid;
      place-items: center;
    }

    .app {
      width: min(96vw, 560px);
      display: grid;
      gap: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      letter-spacing: 0.5px;
      text-shadow: 0 0 18px rgba(108, 240, 255, 0.25);
    }

    .title b {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 20px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    .hud {
      background: linear-gradient(180deg, rgba(166, 176, 255, 0.05), rgba(34, 40, 90, 0.14));
      border: 1px solid rgba(108, 240, 255, 0.2);
      border-radius: 12px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 10px 12px;
      gap: 8px;
    }

    .hud .stat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .hud .stat small { color: var(--muted); font-weight: 600; }

    .hud .center { justify-self: center; color: var(--muted); font-size: 12px; }

    .surface {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: var(--shadow);
      background: linear-gradient(180deg, rgba(108, 240, 255, 0.06), rgba(168, 108, 255, 0.06));
      border: 1px solid rgba(168, 108, 255, 0.28);
      outline: 1px solid rgba(108, 240, 255, 0.12);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 14;
      background:
        radial-gradient(40% 20% at 50% 0%, rgba(108, 240, 255, 0.14) 0%, rgba(108, 240, 255, 0.0) 60%),
        radial-gradient(50% 50% at 50% 100%, rgba(168, 108, 255, 0.22) 0%, rgba(168, 108, 255, 0.0) 60%),
        linear-gradient(180deg, #0a0f19 0%, #0b0f17 100%);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(11, 15, 23, 0.75), rgba(11, 15, 23, 0.82));
      backdrop-filter: blur(2px);
      border-radius: 16px;
    }

    .card {
      text-align: center;
      padding: 18px 20px;
      background: linear-gradient(180deg, rgba(166, 176, 255, 0.06), rgba(34, 40, 90, 0.16));
      border: 1px solid rgba(108, 240, 255, 0.24);
      border-radius: 14px;
    }

    .card h2 { margin: 4px 0 6px; font-size: 18px; }
    .card p  { margin: 6px 0 12px; color: var(--muted); font-size: 13px; }

    .row { display: flex; gap: 8px; justify-content: center; }

    .btn {
      border: 1px solid rgba(108, 240, 255, 0.45);
      color: var(--text);
      background: linear-gradient(180deg, rgba(108, 240, 255, 0.15), rgba(168, 108, 255, 0.15));
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, background 200ms ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.98); filter: brightness(0.92); }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 10px;
      position: absolute;
      inset: auto 0 0 0;
      background: linear-gradient(180deg, rgba(5,8,14,0), rgba(5,8,14,0.6));
    }

    .ctrl { padding: 10px; font-weight: 900; font-size: 12px; }
    .ctrl.left  { border-color: rgba(108,240,255,0.5); }
    .ctrl.fire  { border-color: rgba(168,108,255,0.5); }
    .ctrl.right { border-color: rgba(108,240,255,0.5); }

    @media (pointer: fine) and (hover: hover) {
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">
        <b>Neon Space Shooter</b>
        <span class="subtitle">Arrow/A-D: Move • Space/K: Fire • P: Pause</span>
      </div>
      <button id="btnPause" class="btn" aria-label="Pause/Resume">Pause</button>
    </div>

    <div class="hud">
      <div class="stat"><small>Score</small><span id="score">000000</span></div>
      <div class="center">Survive waves. Shoot enemies. Don't let them pass.</div>
      <div class="stat" style="justify-self: end"><small>Lives</small><span id="lives">3</span></div>
    </div>

    <div class="surface">
      <canvas id="game" width="480" height="740" aria-label="Game canvas" role="img"></canvas>

      <div id="overlay" class="overlay">
        <div class="card">
          <h2>Ready, Pilot?</h2>
          <p>Move with Arrow/A-D, shoot with Space or K. Touch controls on mobile.</p>
          <div class="row">
            <button id="btnStart" class="btn">Start</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="ctrlLeft"  class="btn ctrl left">◀</button>
        <button id="ctrlFire"  class="btn ctrl fire">FIRE</button>
        <button id="ctrlRight" class="btn ctrl right">▶</button>
      </div>
    </div>
  </div>

  <script>
  (function() {
    "use strict";

    // ----- Utility helpers -----
    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function randBetween(min, max) { return Math.random() * (max - min) + min; }

    function formatScore(score) {
      const s = Math.floor(score).toString();
      return s.padStart(6, "0");
    }

    // ----- Audio (no external assets) -----
    class SoundManager {
      constructor() {
        this.audioContext = null;
        this.isEnabled = true;
      }
      ensureContext() {
        if (!this.audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) { this.isEnabled = false; return; }
          this.audioContext = new AudioCtx();
        }
        if (this.audioContext.state === "suspended") {
          this.audioContext.resume();
        }
      }
      beep({ frequency = 440, durationMs = 80, type = "sine", volume = 0.05 } = {}) {
        if (!this.isEnabled) return;
        this.ensureContext();
        if (!this.audioContext) return;
        const ctx = this.audioContext;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = frequency;
        gain.gain.value = volume;
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + durationMs / 1000);
      }
      fire() { this.beep({ frequency: 560, durationMs: 60, type: "square", volume: 0.06 }); }
      hit()  { this.beep({ frequency: 220, durationMs: 80, type: "triangle", volume: 0.07 }); }
      lose() { this.beep({ frequency: 140, durationMs: 220, type: "sawtooth", volume: 0.05 }); }
      start(){ this.beep({ frequency: 720, durationMs: 100, type: "square", volume: 0.07 }); }
    }

    // ----- Input -----
    class InputManager {
      constructor() {
        this.left = false;
        this.right = false;
        this.fire = false;
        this.onFireCallback = null;
        this._bindKeyboard();
      }
      _bindKeyboard() {
        const onKey = (pressed, e) => {
          const code = e.code;
          if (code === "ArrowLeft" || code === "KeyA") this.left = pressed;
          if (code === "ArrowRight" || code === "KeyD") this.right = pressed;
          if (code === "Space" || code === "KeyK") {
            this.fire = pressed;
            if (pressed && this.onFireCallback) this.onFireCallback();
            e.preventDefault();
          }
          if (code === "KeyP") {
            const btn = document.getElementById("btnPause");
            btn?.click();
          }
        };
        window.addEventListener("keydown", e => onKey(true, e), { passive: false });
        window.addEventListener("keyup",   e => onKey(false, e));
      }
      bindTouchButtons(leftEl, fireEl, rightEl) {
        const press = (setter) => (e) => { setter(true); e.preventDefault(); };
        const release = (setter) => () => setter(false);
        const bind = (el, setter, onTap) => {
          const down = press(setter);
          const up   = release(setter);
          el.addEventListener("touchstart", down, { passive: false });
          el.addEventListener("touchend", up);
          el.addEventListener("touchcancel", up);
          el.addEventListener("mousedown", down);
          el.addEventListener("mouseup", up);
          el.addEventListener("mouseleave", up);
          if (onTap) el.addEventListener("click", onTap);
        };
        bind(leftEl,  (v) => { this.left = v; }, null);
        bind(rightEl, (v) => { this.right = v; }, null);
        bind(fireEl,  (v) => { this.fire = v; }, () => this.onFireCallback && this.onFireCallback());
      }
    }

    // ----- Entities -----
    class Rectangle {
      constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
      }
      intersects(other) {
        return !(this.x + this.w < other.x ||
                 other.x + other.w < this.x ||
                 this.y + this.h < other.y ||
                 other.y + other.h < this.y);
      }
    }

    class Player extends Rectangle {
      constructor(boundsWidth, boundsHeight) {
        const width = 38, height = 22;
        const x = (boundsWidth - width) / 2;
        const y = boundsHeight - height - 20;
        super(x, y, width, height);
        this.boundsWidth = boundsWidth;
        this.speedUnitsPerSecond = 280;
        this.cooldownMs = 220;
        this.timeSinceLastShotMs = 9999;
        this.isAlive = true;
      }
      update(dtMs, input) {
        if (!this.isAlive) return;
        const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        const dx = dir * this.speedUnitsPerSecond * (dtMs / 1000);
        this.x = clamp(this.x + dx, 6, this.boundsWidth - this.w - 6);
        this.timeSinceLastShotMs += dtMs;
      }
      canShoot() { return this.timeSinceLastShotMs >= this.cooldownMs; }
      shoot() { this.timeSinceLastShotMs = 0; }
    }

    class Bullet extends Rectangle {
      constructor(x, y) {
        super(x, y, 4, 10);
        this.speedUnitsPerSecond = 520;
        this.isAlive = true;
      }
      update(dtMs) {
        this.y -= this.speedUnitsPerSecond * (dtMs / 1000);
        if (this.y + this.h < -10) this.isAlive = false;
      }
    }

    class Enemy extends Rectangle {
      constructor(x, y, speed) {
        super(x, y, 30, 20);
        this.speedUnitsPerSecond = speed;
        this.isAlive = true;
        this.waveSwayPhase = Math.random() * Math.PI * 2;
        this.waveSwayAmplitude = randBetween(6, 22);
      }
      update(dtMs, tMs) {
        const t = tMs / 1000;
        this.y += this.speedUnitsPerSecond * (dtMs / 1000);
        this.x += Math.sin(t * 2 + this.waveSwayPhase) * 0.2 * this.waveSwayAmplitude;
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.vx = randBetween(-80, 80); this.vy = randBetween(-140, -20);
        this.lifeMs = randBetween(200, 480);
        this.ageMs = 0;
        this.size = randBetween(1, 3);
        this.color = color;
      }
      update(dtMs) {
        this.ageMs += dtMs;
        this.x += this.vx * (dtMs / 1000);
        this.y += this.vy * (dtMs / 1000);
        this.vy += 240 * (dtMs / 1000);
      }
      get isAlive() { return this.ageMs < this.lifeMs; }
    }

    // ----- Game -----
    class Game {
      constructor(canvas, ui) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.ui = ui;

        this.pixelRatio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        this.logicalWidth = canvas.width;  // 480
        this.logicalHeight = canvas.height; // 740

        this.sound = new SoundManager();
        this.input = new InputManager();

        this.player = new Player(this.logicalWidth, this.logicalHeight);
        this.bullets = [];
        this.enemies = [];
        this.particles = [];

        this.timeMs = 0;
        this.lastFrameTs = 0;
        this.isRunning = false;
        this.isPaused = false;
        this.score = 0;
        this.lives = 3;
        this.spawnCooldownMs = 700;
        this.enemySpeedBase = 50;
        this.enemySpeedIncreasePerMin = 60;
        this.timeSinceLastSpawnMs = 0;

        this._resizeCanvas();
        window.addEventListener("resize", () => this._resizeCanvas());
        this.input.onFireCallback = () => {
          if (!this.isRunning) return;
          this._tryShoot();
        };
      }

      start() {
        this.reset();
        this.isRunning = true;
        this.isPaused = false;
        this.lastFrameTs = performance.now();
        this.sound.start();
        requestAnimationFrame((ts) => this._frame(ts));
      }

      pauseToggle() {
        if (!this.isRunning) return;
        this.isPaused = !this.isPaused;
        this.ui.setOverlay(this.isPaused ? "Paused" : null);
      }

      gameOver() {
        this.isRunning = false;
        this.sound.lose();
        this.ui.setOverlay("Game Over", `Score: ${formatScore(this.score)}`);
      }

      reset() {
        this.player = new Player(this.logicalWidth, this.logicalHeight);
        this.bullets = [];
        this.enemies = [];
        this.particles = [];
        this.timeMs = 0;
        this.isPaused = false;
        this.score = 0;
        this.lives = 3;
        this.timeSinceLastSpawnMs = 0;
        this.ui.updateScore(this.score);
        this.ui.updateLives(this.lives);
      }

      _resizeCanvas() {
        const ratio = this.pixelRatio;
        const displayWidth = this.canvas.clientWidth;
        const displayHeight = Math.round(displayWidth * (this.logicalHeight / this.logicalWidth));
        if (this.canvas.width  !== displayWidth * ratio ||
            this.canvas.height !== displayHeight * ratio) {
          this.canvas.width  = Math.floor(displayWidth * ratio);
          this.canvas.height = Math.floor(displayHeight * ratio);
        }
        this.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      _frame(timestamp) {
        if (!this.isRunning) return;
        const dtMs = clamp(timestamp - this.lastFrameTs, 0, 50);
        this.lastFrameTs = timestamp;

        if (!this.isPaused) {
          this._update(dtMs);
          this._render();
        }
        requestAnimationFrame((ts) => this._frame(ts));
      }

      _tryShoot() {
        if (!this.player.canShoot()) return;
        const bx = this.player.x + this.player.w / 2 - 2;
        const by = this.player.y - 8;
        this.bullets.push(new Bullet(bx, by));
        this.player.shoot();
        this.sound.fire();
      }

      _spawnEnemy() {
        const lanePadding = 20;
        const x = randBetween(lanePadding, this.logicalWidth - lanePadding - 30);
        const y = -24;
        const tMin = this.timeMs / 60000; // minutes elapsed
        const speed = this.enemySpeedBase + tMin * this.enemySpeedIncreasePerMin + randBetween(-10, 40);
        this.enemies.push(new Enemy(x, y, speed));
      }

      _update(dtMs) {
        this.timeMs += dtMs;

        // Player
        this.player.update(dtMs, this.input);
        if (this.input.fire) this._tryShoot();

        // Bullets
        for (const bullet of this.bullets) bullet.update(dtMs);
        this.bullets = this.bullets.filter(b => b.isAlive);

        // Enemies
        this.timeSinceLastSpawnMs += dtMs;
        const spawnEvery = this.spawnCooldownMs * clamp(1 - this.timeMs / 120000, 0.45, 1);
        if (this.timeSinceLastSpawnMs >= spawnEvery) {
          this._spawnEnemy();
          this.timeSinceLastSpawnMs = 0;
        }
        for (const enemy of this.enemies) enemy.update(dtMs, this.timeMs);

        // Collisions: bullet vs enemy
        for (const enemy of this.enemies) {
          if (!enemy.isAlive) continue;
          for (const bullet of this.bullets) {
            if (!bullet.isAlive) continue;
            if (bullet.intersects(enemy)) {
              enemy.isAlive = false;
              bullet.isAlive = false;
              this.score += 25;
              this.ui.updateScore(this.score);
              this.sound.hit();
              this._explode(enemy.x + enemy.w/2, enemy.y + enemy.h/2, "#a86cff");
              break;
            }
          }
        }

        // Remove dead enemies
        this.enemies = this.enemies.filter(e => e.isAlive && e.y < this.logicalHeight + 40);

        // Enemy reaches bottom or collides with player
        for (const enemy of this.enemies) {
          if (enemy.y + enemy.h >= this.logicalHeight - 6 || enemy.intersects(this.player)) {
            enemy.isAlive = false;
            this._explode(this.player.x + this.player.w/2, this.player.y, "#ff6c9b");
            this.lives -= 1;
            this.ui.updateLives(this.lives);
            this.sound.lose();
            if (this.lives <= 0) {
              this.gameOver();
              return;
            }
          }
        }

        // Particles
        for (const p of this.particles) p.update(dtMs);
        this.particles = this.particles.filter(p => p.isAlive);
      }

      _explode(x, y, color) {
        for (let i = 0; i < 16; i++) {
          this.particles.push(new Particle(x, y, color));
        }
      }

      _render() {
        const ctx = this.ctx;
        const w = this.logicalWidth;
        const h = Math.round(this.canvas.clientWidth * (this.logicalHeight / this.logicalWidth));
        // Clear
        ctx.clearRect(0, 0, w, h);

        // Parallax stars
        this._drawStars(ctx, w, h, this.timeMs);

        // Player
        this._drawShip(ctx, this.player.x, this.player.y, this.player.w, this.player.h);

        // Bullets
        ctx.fillStyle = "#6cf0ff";
        for (const b of this.bullets) ctx.fillRect(b.x, b.y, b.w, b.h);

        // Enemies
        for (const e of this.enemies) this._drawEnemy(ctx, e.x, e.y, e.w, e.h);

        // Particles
        for (const p of this.particles) this._drawParticle(ctx, p);
      }

      _drawStars(ctx, w, h, tMs) {
        const t = tMs / 1000;
        const rows = 3;
        for (let r = 0; r < rows; r++) {
          const count = 24 + r * 12;
          ctx.fillStyle = `rgba(166,176,255,${0.12 + r * 0.06})`;
          for (let i = 0; i < count; i++) {
            const x = (i * (w / count) + (t * (10 + r * 18))) % w;
            const y = ((i * 37 + r * 120 + t * (18 + r * 26)) % h);
            ctx.fillRect(x, y, 1 + (r % 2), 1 + (r % 2));
          }
        }
      }

      _drawShip(ctx, x, y, w, h) {
        ctx.save();
        ctx.translate(x + w/2, y + h/2);
        ctx.shadowColor = "#6cf0ff";
        ctx.shadowBlur = 8;
        ctx.fillStyle = "#c7faff";
        ctx.strokeStyle = "#6cf0ff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -h/2);
        ctx.lineTo(w/2,  h/2);
        ctx.lineTo(0,    h/4);
        ctx.lineTo(-w/2, h/2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      _drawEnemy(ctx, x, y, w, h) {
        ctx.save();
        ctx.translate(x + w/2, y + h/2);
        ctx.shadowColor = "#a86cff";
        ctx.shadowBlur = 8;
        ctx.fillStyle = "#e8d4ff";
        ctx.strokeStyle = "#a86cff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-w/2, -h/4);
        ctx.lineTo(0,     -h/2);
        ctx.lineTo(w/2,  -h/4);
        ctx.lineTo(w/3,   h/2);
        ctx.lineTo(-w/3,  h/2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      _drawParticle(ctx, p) {
        const lifeRatio = 1 - (p.ageMs / p.lifeMs);
        ctx.globalAlpha = clamp(lifeRatio, 0, 1);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1;
      }
    }

    // ----- UI wiring -----
    const canvas = document.getElementById("game");
    const ui = {
      scoreEl: document.getElementById("score"),
      livesEl: document.getElementById("lives"),
      overlayEl: document.getElementById("overlay"),
      startBtn: document.getElementById("btnStart"),
      pauseBtn: document.getElementById("btnPause"),
      leftBtn: document.getElementById("ctrlLeft"),
      fireBtn: document.getElementById("ctrlFire"),
      rightBtn: document.getElementById("ctrlRight"),
      setOverlay(title, subtitle) {
        if (!title) { this.overlayEl.style.display = "none"; return; }
        this.overlayEl.style.display = "grid";
        this.overlayEl.innerHTML = `
          <div class="card">
            <h2>${title}</h2>
            ${subtitle ? `<p>${subtitle}</p>` : ""}
            <div class="row"><button id="btnOverlayStart" class="btn">${title === 'Paused' ? 'Resume' : 'Play Again'}</button></div>
          </div>`;
        document.getElementById("btnOverlayStart").addEventListener("click", () => {
          this.overlayEl.style.display = "none";
          game.start();
        });
      },
      updateScore(score) { this.scoreEl.textContent = formatScore(score); },
      updateLives(lives) { this.livesEl.textContent = String(lives); },
    };

    const game = new Game(canvas, ui);

    ui.startBtn.addEventListener("click", () => {
      ui.overlayEl.style.display = "none";
      game.start();
    });

    ui.pauseBtn.addEventListener("click", () => game.pauseToggle());

    // Touch controls
    game.input.bindTouchButtons(ui.leftBtn, ui.fireBtn, ui.rightBtn);

    // Improve first interaction audio policy
    const unlockAudio = () => {
      game.sound.ensureContext();
      window.removeEventListener("pointerdown", unlockAudio);
      window.removeEventListener("keydown", unlockAudio);
    };
    window.addEventListener("pointerdown", unlockAudio);
    window.addEventListener("keydown", unlockAudio);
  })();
  </script>
</body>
</html>
