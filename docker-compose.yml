version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports: ["8025:8025"]
  minio:
    image: minio/minio
    command: server /data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data
  api:
    build: ./backend
    command: npm run dev
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/enterprise
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=dev-access-secret-1234567890-dev-access-secret
      - JWT_REFRESH_SECRET=dev-refresh-secret-1234567890-dev-refresh-secret
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    ports: ["4000:4000"]
    depends_on: [mongo, redis, mailhog]
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
  web:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app
    depends_on: [api]
  nginx:
    image: nginx:1.27
    ports: ["8080:80"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api, web]

volumes:
  mongo_data: {}
  minio_data: {}
