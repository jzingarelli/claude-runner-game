name: CI
on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main, '**' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root deps
        run: npm i
      - name: Install backend deps
        working-directory: backend
        run: npm i
      - name: Install frontend deps
        working-directory: frontend
        run: npm i
      - name: Lint
        run: npm run lint
      - name: Test backend
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/ci
        run: npm test -- --ci
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --ci
      - name: Build
        run: npm run build
