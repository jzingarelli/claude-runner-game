apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: analytics-api }
  template:
    metadata:
      labels: { app: analytics-api }
    spec:
      containers:
        - name: api
          image: your-registry/analytics-api:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef: { name: analytics-secrets, key: MONGO_URI }
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
spec:
  selector: { app: analytics-api }
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 4000
