apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: analytics-web }
  template:
    metadata:
      labels: { app: analytics-web }
    spec:
      containers:
        - name: web
          image: your-registry/analytics-web:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-web
spec:
  selector: { app: analytics-web }
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
